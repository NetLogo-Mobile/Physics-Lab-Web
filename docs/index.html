  <script vid="39">
        const { createApp, ref, onMounted, computed } = Vue;

        
        const FadeIn = {
            props: {
                delay: { type: Number, default: 0 },
                duration: { type: Number, default: 1000 }
            },
            setup(props) {
                const isVisible = ref(false);
                onMounted(() => {
                    setTimeout(() => {
                        isVisible.value = true;
                    }, props.delay);
                });
                return { isVisible };
            },
            template: `
                <div class="transition-opacity ease-out"
                     :class="[isVisible ? 'opacity-100' : 'opacity-0']"
                     :style="{ transitionDuration: duration + 'ms' }">
                    <slot></slot>
                </div>
            `
        };

        
        const AnimatedHeading = {
            props: {
                text: { type: String, required: true }
            },
            setup(props) {
                const isAnimating = ref(false);
                const lines = computed(() => props.text.split('\n'));

                const calculateDelay = (lineIndex, charIndex) => {
                    const charDelay = 30;
                    const lineLength = lines.value[lineIndex].length;
                    return (lineIndex * lineLength * charDelay) + (charIndex * charDelay);
                };

                onMounted(() => {
                    setTimeout(() => {
                        isAnimating.value = true;
                    }, 200);
                });

                return { isAnimating, lines, calculateDelay };
            },
            template: `
                <h1 class="text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-normal mb-4" style="letter-spacing: -0.04em">
                    <div v-for="(line, lineIndex) in lines" :key="lineIndex" class="block whitespace-nowrap">
                        <span v-for="(char, charIndex) in line.split('')" :key="charIndex"
                              class="inline-block transition-all ease-out"
                              :class="[isAnimating ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-[18px]']"
                              :style="{
                                  transitionDuration: '500ms',
                                  transitionDelay: calculateDelay(lineIndex, charIndex) + 'ms'
                              }"
                              v-html="char === ' ' ? ' ' : char">
                        </span>
                    </div>
                </h1>
            `
        };

        
        const app = createApp({
            data() {
                return {
                    headingText: "Shaping tomorrow\n"
                }
            }
        });

        app.component('fade-in', FadeIn);
        app.component('animated-heading', AnimatedHeading);
        app.mount('#app');
    </script>
