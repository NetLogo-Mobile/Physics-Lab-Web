
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plweb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #e53e3e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 动态背景粒子效果 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.8;
            }
        }

        /* 主容器 */
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease-out;
        }

        /* Logo 样式 */
        .logo {
            margin-bottom: 20px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #e53e3e, #1e3c72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        /* 维护图标 */
        .maintenance-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #e53e3e, #ff6b6b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(229, 62, 62, 0.3);
        }

        .maintenance-icon::before {
            content: '🔧';
            font-size: 30px;
            animation: rotate 3s linear infinite;
        }

        /* --- 新增图片样式 --- */
        .feature-image-container {
            width: 100%;
            margin-bottom: 25px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: #eee; /* 图片加载前的占位色 */
        }

        .feature-image {
            width: 100%;
            display: block;
            border-radius: 15px;
            /* 如果图片没加载出来，显示的提示高度 */
            min-height: 150px; 
            object-fit: cover;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(229, 62, 62, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(229, 62, 62, 0.5); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .title {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .description {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #1e3c72, #e53e3e);
            border-radius: 3px;
            animation: progress 3s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .status {
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }

        .icp-info {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        .blink { animation: blink 2s ease-in-out infinite; }
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .container { padding: 30px 20px; }
            .logo-text { font-size: 24px; }
            .title { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo">
            <div class="logo-text">Physics-Lab-Web</div>
        </div>

        <!-- 维护图标 -->
        <div class="maintenance-icon"></div>

        <!-- 新增：图片插入位置 -->
        <div class="feature-image-container">
            <img src="https://netlogo-mobile.github.io/Physics-Lab-Web/img.png" class="feature-image">
            <!-- 请在上面的 src="" 中填入你的图片路径 -->
        </div>

        <h1 class="title">系统维护中</h1>

        <p class="description">
            系统正在进行例行维护升级，暂时无法提供服务。<br>
            我们正在努力提升系统性能，为您带来更好的使用体验。
        </p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="status blink">
            维护进行中，请稍后再试...
        </div>

        <div class="icp-info">
          2025年7月30日 21:58
        </div>
    </div>

    <script>
        // 1. 立即清除所有历史数据
        (function clearHistory() {
            // 清除 LocalStorage
            localStorage.clear();
            // 清除 SessionStorage
            sessionStorage.clear();
            // 清除 Cookies
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            }
            console.log("所有本地缓存数据已清理完毕");
        })();

        // 2. 创建动态背景粒子
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 40;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            // 3D 悬浮效果
            document.addEventListener('mousemove', function(e) {
                const container = document.querySelector('.container');
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                const rotateX = (y / rect.height) * 8;
                const rotateY = (x / rect.width) * -8;
                container.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            
            document.addEventListener('mouseleave', function() {
                const container = document.querySelector('.container');
                container.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            });
        });
    </script>
</body>
</html>
